<!doctype html>
<meta charset="utf-8" />
<title>yt-thumbnails</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --field: #ffffff;
    --card: #fbfbfc;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --danger: #b91c1c;
    --ok: #15803d;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --fg: #e8eaed;
      --muted: #9aa1ab;
      --line: #2c3038;
      --field: #1e2127;
      --card: #1b1e24;
      --accent: #3b82f6;
      --accent-fg: #ffffff;
      --danger: #f87171;
      --ok: #4ade80;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,
      sans-serif;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  label {
    display: block;
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
  }

  input,
  select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--field);
    color: var(--fg);
    font: inherit;
  }

  input:focus-visible,
  select:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(3, 1fr) auto;
    gap: 12px;
    align-items: end;
    margin-top: 12px;
  }

  button {
    padding: 9px 18px;
    border: 0;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-fg);
    font: inherit;
    font-weight: 550;
    cursor: pointer;
    white-space: nowrap;
  }

  button.secondary {
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg);
    font-size: 12px;
    font-weight: 500;
  }

  .queue-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 28px 0 10px;
  }

  .queue-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }

  #empty {
    padding: 32px 0;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
  }

  .job {
    display: grid;
    grid-template-columns: 96px 1fr auto;
    gap: 14px;
    align-items: start;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--card);
  }

  .job .thumb {
    width: 96px;
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid var(--line);
    object-fit: cover;
    background: var(--field);
  }

  .job .thumb.placeholder {
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 11px;
  }

  .job .title {
    font-weight: 550;
    overflow-wrap: anywhere;
  }

  .job .sub,
  .job .detail {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .job .detail {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
  }

  .job .error {
    margin-top: 4px;
    color: var(--danger);
    font-size: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 11px;
    font-weight: 550;
  }

  .badge.done {
    color: var(--ok);
    border-color: currentColor;
  }

  .badge.failed {
    color: var(--danger);
    border-color: currentColor;
  }

  .badge.running {
    color: var(--accent);
    border-color: currentColor;
  }

  .job .actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
</style>

<h1>YouTube 썸네일 그리드</h1>

<form id="form">
  <label for="url">영상 URL</label>
  <input
    id="url"
    type="text"
    placeholder="https://youtube.com/watch?v=..."
    required
  />

  <div class="row">
    <div>
      <label for="grid">그리드</label>
      <select id="grid">
        <option>3</option>
        <option selected>4</option>
        <option>5</option>
        <option>6</option>
      </select>
    </div>
    <div>
      <label for="mode">모드</label>
      <select id="mode">
        <option value="uniform" selected>균등 간격</option>
        <option value="scene">장면 감지</option>
      </select>
    </div>
    <div>
      <label for="threshold">threshold</label>
      <input id="threshold" type="number" min="0" max="1" step="0.05" value="0.4" />
    </div>
    <button type="submit">추가</button>
  </div>
</form>

<div class="queue-head">
  <h2>작업 큐</h2>
  <button id="clear" class="secondary" type="button" hidden>
    완료 항목 지우기
  </button>
</div>

<div id="empty">아직 추가된 작업이 없습니다</div>
<div id="jobs"></div>

<script type="module">
  const form = document.getElementById('form')
  const jobsEl = document.getElementById('jobs')
  const emptyEl = document.getElementById('empty')
  const clearBtn = document.getElementById('clear')

  const LABEL = {
    queued: '대기',
    running: '진행 중',
    done: '완료',
    failed: '실패',
    cancelled: '취소됨',
  }

  const stamps = new Map()

  const render = (jobs) => {
    emptyEl.hidden = jobs.length > 0
    clearBtn.hidden = !jobs.some((job) => job.status !== 'queued' && job.status !== 'running')

    jobsEl.replaceChildren(
      ...jobs.map((job) => {
        const row = document.createElement('div')
        row.className = 'job'

        if (job.status === 'done') {
          if (!stamps.has(job.id)) {
            stamps.set(job.id, Date.now())
          }

          const img = document.createElement('img')
          img.className = 'thumb'
          img.alt = ''
          img.src = `/result.jpg?id=${job.id}&t=${stamps.get(job.id)}`
          row.append(img)
        } else {
          const box = document.createElement('div')
          box.className = 'thumb placeholder'
          box.textContent = `${job.grid}×${job.grid}`
          row.append(box)
        }

        const body = document.createElement('div')

        const title = document.createElement('div')
        title.className = 'title'
        title.textContent = job.title || job.url
        body.append(title)

        const sub = document.createElement('div')
        sub.className = 'sub'
        const badge = document.createElement('span')
        badge.className = `badge ${job.status}`
        badge.textContent = LABEL[job.status]
        sub.append(badge)

        if (job.message && job.message !== LABEL[job.status]) {
          sub.append(` ${job.message}`)
        }
        body.append(sub)

        if (job.detail) {
          const detail = document.createElement('div')
          detail.className = 'detail'
          detail.textContent = job.detail
          body.append(detail)
        }

        if (job.error) {
          const error = document.createElement('div')
          error.className = 'error'
          error.textContent = job.error
          body.append(error)
        }

        row.append(body)

        const actions = document.createElement('div')
        actions.className = 'actions'

        if (job.status === 'queued' || job.status === 'running') {
          const cancel = document.createElement('button')
          cancel.className = 'secondary'
          cancel.type = 'button'
          cancel.textContent = '취소'
          cancel.addEventListener('click', () => window.__cancel(job.id))
          actions.append(cancel)
        }

        if (job.status === 'done') {
          const open = document.createElement('button')
          open.className = 'secondary'
          open.type = 'button'
          open.textContent = '폴더 열기'
          open.addEventListener('click', () => window.__reveal(job.id))
          actions.append(open)
        }

        row.append(actions)

        return row
      })
    )
  }

  window.__onJobs = render

  form.addEventListener('submit', (event) => {
    event.preventDefault()

    const url = document.getElementById('url')

    window.__enqueue({
      url: url.value.trim(),
      grid: Number(document.getElementById('grid').value),
      mode: document.getElementById('mode').value,
      threshold: Number(document.getElementById('threshold').value),
    })

    url.value = ''
    url.focus()
  })

  clearBtn.addEventListener('click', () => window.__clearFinished())
</script>
